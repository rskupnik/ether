apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-db
  labels:
    app: backup
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup-db
              image: postgres:17-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  notify() {
                    local message="$1"

                    curl -fsS --retry 2 --max-time 10 \
                      -H "Content-Type: application/json" \
                      --data-urlencode "content=$message" \
                      "${DISCORD_BACKUPS_WEBHOOK}?wait=true" \
                      || echo "WARNING: Discord notification failed"
                  }

                  echo "Install rsync"
                  apk add --no-cache rsync openssh-client

                  echo "Dumping all PostgreSQL databases..."
                  pg_dumpall --clean --if-exists -h ${DB_HOST} -U ${DB_USER} > /tmp/all.sql

                  echo "Ensuring target directory exists..."
                  ssh -i /ssh-keys/offsite -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                    pi@192.168.178.69 "mkdir -p /mnt/backup/${DB_PATH}/db"

                  echo "Sending DB dump to remote host..."
                  rsync -av \
                    -e "ssh -i /ssh-keys/offsite -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
                    /tmp/all.sql \
                    pi@192.168.178.69:/mnt/backup/${DB_PATH}/db/

                  echo "Backup completed."
                  notify "✅ Immich backup completed"
              env:
                - secretRef:
                    name: discord-secrets
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: placeholder
                      key: password
                - name: DB_HOST
                  value: placeholder
                - name: DB_USER
                  value: placeholder
                - name: DB_PATH
                  value: placeholder
              volumeMounts:
                - name: ssh-keys
                  mountPath: /ssh-keys
          volumes:
            - name: ssh-keys
              secret:
                secretName: ssh-keys
                defaultMode: 0600
