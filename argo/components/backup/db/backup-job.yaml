apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-db
  labels:
    app: backup
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup-db
              image: postgres:17-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  #!/bin/sh
                  set -eu

                  notify() {
                    status="$1"
                    message="$2"

                    if [ "$status" = "success" ]; then
                      webhook="$DISCORD_BACKUPS_WEBHOOK"
                      message="✅ $message"
                    else
                      webhook="$DISCORD_ALERTS_WEBHOOK"
                      message="❌ <@${DISCORD_USER_ID}> $message"
                    fi

                    curl -fsS --retry 2 --max-time 10 \
                      --data-urlencode "content=$message" \
                      "${webhook}?wait=true" \
                      || echo "WARNING: Discord notification failed"
                  }

                  on_exit() {
                    exit_code="$1"

                    trap - EXIT

                    if [ "$exit_code" -eq 0 ]; then
                      notify success "Database backup completed: ${DB_PATH}"
                    else
                      notify failure "Database backup FAILED: ${DB_PATH} (exit code: ${exit_code})"
                    fi
                  }

                  trap 'on_exit "$?"' EXIT

                  echo "Installing tools..."
                  apk add --no-cache restic openssh-client curl

                  echo "Configuring restic..."
                  export RESTIC_REPOSITORY="sftp:pi@192.168.178.69:/mnt/backup/${DB_PATH}/db-restic"
                  export RESTIC_SFTP_COMMAND="ssh -i /ssh-keys/offsite -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes"

                  echo "Checking restic repository..."
                  if ! restic cat config >/dev/null 2>&1; then
                    # Only initialize if the remote repository is absent.
                    # Other errors must fail the backup.
                    if ssh -i /ssh-keys/offsite \
                      -o StrictHostKeyChecking=no \
                      -o UserKnownHostsFile=/dev/null \
                      -o BatchMode=yes \
                      pi@192.168.178.69 \
                      "test ! -e '/mnt/backup/${DB_PATH}/db-restic'"; then
                      echo "Initializing new restic repository..."
                      restic init
                    else
                      echo "Repository unavailable or invalid; refusing to initialize."
                      exit 1
                    fi
                  fi

                  echo "Dumping PostgreSQL database..."
                  pg_dump \
                    --clean \
                    --if-exists \
                    -h "$DB_HOST" \
                    -U "$DB_USER" \
                    -d "$DB_NAME" \
                    -f /tmp/backup.sql

                  echo "Creating restic snapshot..."
                  restic backup /tmp/backup.sql --tag postgres

                  echo "Applying retention policy..."
                  restic forget \
                    --keep-daily 7 \
                    --keep-weekly 4 \
                    --keep-monthly 6 \
                    --prune

                  echo "PostgreSQL backup completed."
              envFrom:
                - secretRef:
                    name: discord-secrets
                - secretRef:
                    name: restic-secrets
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: placeholder
                      key: password
                - name: DB_HOST
                  value: placeholder
                - name: DB_USER
                  value: placeholder
                - name: DB_PATH
                  value: placeholder
                - name: DB_NAME
                  value: placeholder
              volumeMounts:
                - name: ssh-keys
                  mountPath: /ssh-keys
          volumes:
            - name: ssh-keys
              secret:
                secretName: ssh-keys
                defaultMode: 0600
