apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-redis
  labels:
    app: backup
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup-redis
              image: redis:8-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  #!/bin/sh
                  set -eu

                  notify() {
                    status="$1"
                    message="$2"

                    if [ "$status" = "success" ]; then
                      webhook="$DISCORD_BACKUPS_WEBHOOK"
                      message="✅ $message"
                    else
                      webhook="$DISCORD_ALERTS_WEBHOOK"
                      message="❌ <@${DISCORD_USER_ID}> $message"
                    fi

                    curl -fsS --retry 2 --max-time 10 \
                      --data-urlencode "content=$message" \
                      "${webhook}?wait=true" \
                      || echo "WARNING: Discord notification failed"
                  }

                  on_exit() {
                    exit_code="$1"

                    trap - EXIT

                    if [ "$exit_code" -eq 0 ]; then
                      notify success "Redis backup completed: ${DB_PATH}"
                    else
                      notify failure "Redis backup FAILED: ${DB_PATH} (exit code: ${exit_code})"
                    fi
                  }

                  trap 'on_exit "$?"' EXIT

                  echo "Install tools"
                  apk add --no-cache rsync openssh-client curl

                  echo "Triggering Redis RDB snapshot..."
                  redis-cli \
                    -h ${DB_HOST} \
                    -a "$DB_PASSWORD" \
                    BGSAVE

                  echo "Waiting for Redis snapshot to complete..."
                  while [ "$(redis-cli -h ${DB_HOST} -a "$DB_PASSWORD" INFO persistence | grep rdb_bgsave_in_progress | cut -d: -f2 | tr -d '\r')" = "1" ]; do
                    sleep 1
                  done

                  echo "Copying dump.rdb from Redis..."
                  redis-cli \
                    -h ${DB_HOST} \
                    -a "$DB_PASSWORD" \
                    --rdb /tmp/dump.rdb

                  echo "Ensuring target directory exists..."
                  ssh -i /ssh-keys/offsite -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                    pi@192.168.178.69 "mkdir -p /mnt/backup/${DB_PATH}/redis"

                  echo "Sending Redis dump to remote host..."
                  rsync -av \
                    -e "ssh -i /ssh-keys/offsite -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
                    /tmp/dump.rdb \
                    pi@192.168.178.69:/mnt/backup/${DB_PATH}/redis/

                  echo "Redis backup completed."
              envFrom:
                - secretRef:
                    name: discord-secrets
              env:
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: placeholder
                      key: password
                - name: DB_HOST
                  value: placeholder
                - name: DB_PATH
                  value: placeholder
              volumeMounts:
                - name: ssh-keys
                  mountPath: /ssh-keys
          volumes:
            - name: ssh-keys
              secret:
                secretName: ssh-keys
                defaultMode: 0600
