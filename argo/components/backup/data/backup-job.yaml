apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-data
  labels:
    app: backup
spec:
  schedule: "0 3 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: backup
        spec:
          restartPolicy: Never
          serviceAccountName: data-backup-sa
          containers:
            - name: backup-data
              image: alpine:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  #!/bin/sh
                  set -eu

                  notify() {
                    status="$1"
                    message="$2"

                    if [ "$status" = "success" ]; then
                      webhook="$DISCORD_BACKUPS_WEBHOOK"
                      message="✅ $message"
                    else
                      webhook="$DISCORD_ALERTS_WEBHOOK"
                      message="❌ <@${DISCORD_USER_ID}> $message"
                    fi

                    curl -fsS --retry 2 --max-time 10 \
                      --data-urlencode "content=$message" \
                      "${webhook}?wait=true" \
                      || echo "WARNING: Discord notification failed"
                  }

                  on_exit() {
                    exit_code="$1"

                    trap - EXIT

                    if [ "$exit_code" -eq 0 ]; then
                      notify success "Data backup completed: ${DESTINATION_PATH}"
                    else
                      notify failure "Data backup FAILED: ${DESTINATION_PATH} (exit code: ${exit_code})"
                    fi
                  }

                  trap 'on_exit "$?"' EXIT

                  echo "Install tools"
                  apk add --no-cache restic openssh-client kubectl curl

                  echo "Configuring restic..."
                  export RESTIC_REPOSITORY="sftp:pi@192.168.178.69:/mnt/backup/${DESTINATION_PATH}/data"

                  echo "Scaling down"
                  kubectl scale deploy ${DEPLOYMENT_NAME} --replicas=0
                  sleep 6

                  mkdir -p /root/.ssh

                  cat > /root/.ssh/config <<EOF
                  Host 192.168.178.69
                      User pi
                      IdentityFile /ssh-keys/offsite
                      StrictHostKeyChecking no
                      UserKnownHostsFile /dev/null
                      BatchMode yes
                  EOF

                  chmod 600 /root/.ssh/config

                  echo "Checking restic repository..."
                  if ! restic cat config >/dev/null 2>&1; then
                    # Only initialize if the remote repository is absent.
                    # Other errors must fail the backup.
                    if ssh -i /ssh-keys/offsite \
                      -o StrictHostKeyChecking=no \
                      -o UserKnownHostsFile=/dev/null \
                      -o BatchMode=yes \
                      pi@192.168.178.69 \
                      "test ! -e '/mnt/backup/${DESTINATION_PATH}/data'"; then
                      echo "Initializing new restic repository..."
                      restic init
                    else
                      echo "Repository unavailable or invalid; refusing to initialize."
                      exit 1
                    fi
                  fi

                  echo "Creating restic snapshot..."
                  restic backup /data --tag data

                  echo "Applying retention policy..."
                  restic forget \
                    --keep-daily 7 \
                    --keep-weekly 4 \
                    --keep-monthly 6 \
                    --prune

                  echo "Scaling up"
                  kubectl scale deploy ${DEPLOYMENT_NAME} --replicas=1

                  echo "Backup complete."
              envFrom:
                - secretRef:
                    name: discord-secrets
                - secretRef:
                    name: restic-secrets
              env:
                - name: DEPLOYMENT_NAME
                  value: placeholder
                - name: DESTINATION_PATH
                  value: placeholder
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: ssh-keys
                  mountPath: /ssh-keys
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: placeholder
            - name: ssh-keys
              secret:
                secretName: ssh-keys
                defaultMode: 0600
