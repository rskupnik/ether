namespace: paperless

helmCharts:
  - name: paperless-ngx
    repo: oci://codeberg.org/wrenix/helm-charts
    releaseName: paperless
    namespace: paperless
    version: 0.2.1
    valuesFile: values.yaml

generatorOptions:
  disableNameSuffixHash: true

components:
  - ../../components/ntfy-token
  - ../../components/tls-ingress
  - ../../components/backup/db

resources:
  - db-creds-secret.sealed.yaml
  - storage.yaml
  - extra-env-secret.sealed.yaml
  - pvc-patch-job.yaml
  - pvc-patch-rbac.yaml

configMapGenerator:
  - name: db-backup-config
    literals:
      - DB_HOST=paperless-postgresql.paperless.svc.cluster.local
      - DB_USER=paperless
      - DB_PATH=paperless
      - DB_SECRET_NAME=db-creds
      - DB_SECRET_KEY=postgres
      - BACKUP_SCHEDULE="0 3 * * *"
  - name: tls-config
    literals:
      - host=papers.myzopotamia.dev
      - service=paperless
      - port=http
      - pathType=ImplementationSpecific

patches:
  - target:
      group: ""
      version: v1
      kind: Secret
      name: paperless
    patch: |-
      - op: remove
        path: /data/PAPERLESS_REDIS
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: paperless
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/command
        value: ["/bin/sh", "-c"]
      - op: add
        path: /spec/template/spec/containers/0/args
        value:
          - |
            export PAPERLESS_REDIS="redis://default:${REDIS_PASSWORD}@paperless-redis-master"
            exec /init
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: paperless
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: paperless-extra-env
