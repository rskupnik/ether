helmCharts:
  - name: immich
    repo: oci://ghcr.io/immich-app/immich-charts
    releaseName: immich
    namespace: immich
    version: 0.13.1
    valuesFile: values.yaml

generatorOptions:
  disableNameSuffixHash: true

components:
  - ../../components/ntfy-token
  - ../../components/tls-ingress
  - ../../components/backup/db
  - ../../components/backup/data

resources:
  - db-credentials-secret.sealed.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - storage.yaml

configMapGenerator:
  - name: db-backup-config
    literals:
      - DB_HOST=postgres.immich.svc.cluster.local
      - DB_USER=immich
      - DB_PATH=immich
      - DB_SECRET_NAME=immich-postgres-credentials
      - DB_SECRET_KEY=password
      - BACKUP_SCHEDULE="0 2 * * *"
  - name: data-backup-config
    literals:
      - DEPLOYMENT_NAME=immich-server
      - DESTINATION_PATH=immich/data/
      - PVC_CLAIM_NAME=immich-data-nas
      - BACKUP_SCHEDULE="0 2 * * *"
  - name: tls-config
    literals:
      - host=photos.myzopotamia.dev
      - service=immich-server
      - port=http
      - pathType=Prefix
