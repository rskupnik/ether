apiVersion: batch/v1
kind: CronJob
metadata:
  name: pocket-id-backup
  namespace: pocket-id
  labels:
    components.nora/ntfy-token: enabled
spec:
  schedule: "40 2 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: pocket-id-backup-sa
          restartPolicy: Never
          containers:
            - name: backup
              image: alpine:3.22
              command: ["/bin/sh", "-c"]
              args:
                - |
                  #!/bin/sh
                  set -eu

                  SSH_KEY="/ssh-keys/offsite"
                  REMOTE="pi@192.168.178.69"
                  REMOTE_BASE="/mnt/backup"
                  REMOTE_DIR="${REMOTE_BASE}/pocket-id"
                  MARKER="${REMOTE_BASE}/.THIS_IS_THE_BACKUP_DISK"
                  SSH_OPTS="-i ${SSH_KEY} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
                  BACKUP="/tmp/pocket-id.zip"

                  notify() {
                    status="$1"
                    message="$2"

                    if [ "$status" = "success" ]; then
                      webhook="$DISCORD_BACKUPS_WEBHOOK"
                      message="✅ $message"
                    else
                      webhook="$DISCORD_ALERTS_WEBHOOK"
                      message="❌ <@${DISCORD_USER_ID}> $message"
                    fi

                    curl -fsS --retry 2 --max-time 10 \
                      --data-urlencode "content=$message" \
                      "${webhook}?wait=true" \
                      || echo "WARNING: Discord notification failed"
                  }

                  on_exit() {
                    exit_code="$1"

                    trap - EXIT

                    if [ "$exit_code" -eq 0 ]; then
                      notify success "Database backup completed: pocket-id"
                    else
                      notify failure "Database backup FAILED: pocket-id (exit code: ${exit_code})"
                    fi
                  }

                  trap on_exit EXIT

                  apk add --no-cache kubectl openssh-client curl unzip

                  echo "Checking offsite backup disk..."
                  ssh $SSH_OPTS "$REMOTE" \
                    "mountpoint -q '${REMOTE_BASE}' && test -f '${MARKER}' && test -w '${REMOTE_BASE}'"

                  echo "Finding running Pocket ID pod..."
                  POD="$(kubectl -n pocket-id get pods \
                    -l app.kubernetes.io/instance=pocket-id \
                    --field-selector=status.phase=Running \
                    -o jsonpath='{.items[0].metadata.name}')"
                  test -n "$POD"

                  echo "Exporting Pocket ID database and uploads..."
                  kubectl -n pocket-id exec "$POD" -- \
                    /app/pocket-id export --path - > "$BACKUP"
                  test -s "$BACKUP"
                  unzip -tq "$BACKUP"

                  echo "Uploading archive to offsite backup..."
                  ssh $SSH_OPTS "$REMOTE" "mkdir -p '${REMOTE_DIR}'"
                  scp $SSH_OPTS "$BACKUP" "$REMOTE:${REMOTE_DIR}/pocket-id.zip.tmp"
                  ssh $SSH_OPTS "$REMOTE" \
                    "mv -f '${REMOTE_DIR}/pocket-id.zip.tmp' '${REMOTE_DIR}/pocket-id.zip'"

                  echo "Pocket ID backup completed."
              envFrom:
                - secretRef:
                    name: discord-secrets
              volumeMounts:
                - name: ssh-keys
                  mountPath: /ssh-keys
                  readOnly: true
          volumes:
            - name: ssh-keys
              secret:
                secretName: ssh-keys
                defaultMode: 0400
