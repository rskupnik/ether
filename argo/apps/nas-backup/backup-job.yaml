apiVersion: batch/v1
kind: CronJob
metadata:
  name: nas-backup
  namespace: nas-backup
spec:
  schedule: "20 1 * * *"

  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: nas-backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: alpine:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  #!/bin/sh
                  set -eu

                  # Folders to back up
                  FOLDERS="wesele odzyskane"

                  SSH_KEY="/offsite-ssh/id_ed25519"
                  REMOTE_USER="pi"
                  REMOTE_HOST="192.168.178.69"
                  REMOTE="${REMOTE_USER}@${REMOTE_HOST}"
                  REMOTE_BASE="/mnt/backup"
                  REMOTE_DATA="${REMOTE_BASE}/data"
                  MARKER="${REMOTE_BASE}/.THIS_IS_THE_BACKUP_DISK"

                  SSH_OPTS="-i ${SSH_KEY} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

                  notify() {
                    status="$1"
                    message="$2"

                    if [ "$status" = "success" ]; then
                      webhook="$DISCORD_BACKUPS_WEBHOOK"
                      message="✅ $message"
                    else
                      webhook="$DISCORD_ALERTS_WEBHOOK"
                      message="❌ <@${DISCORD_USER_ID}> $message"
                    fi

                    curl -fsS --retry 2 --max-time 10 \
                      --data-urlencode "content=$message" \
                      "${webhook}?wait=true" \
                      || echo "WARNING: Discord notification failed"
                  }

                  on_exit() {
                    exit_code="$1"

                    trap - EXIT

                    if [ "$exit_code" -eq 0 ]; then
                      notify success "NAS backup completed"
                    else
                      notify failure "NAS backup failed (exit code: ${exit_code})"
                    fi
                  }

                  trap 'on_exit "$?"' EXIT

                  echo "Installing required packages..."
                  apk add --no-cache rsync openssh-client curl

                  echo "Checking remote backup disk mount..."
                  ssh $SSH_OPTS "$REMOTE" "
                    mountpoint -q '$REMOTE_BASE' &&
                    test -f '$MARKER' &&
                    test -w '$REMOTE_BASE'
                  ";

                  for FOLDER in $FOLDERS; do
                    echo "Ensuring target directory exists for ${FOLDER}..."
                    ssh $SSH_OPTS "$REMOTE" "mkdir -p '$REMOTE_DATA/$FOLDER'"

                    echo "Starting backup of folder ${FOLDER}..."
                    rsync -avh --delete \
                      -e "ssh $SSH_OPTS" \
                      "/data/${FOLDER}/" \
                      "$REMOTE:$REMOTE_DATA/${FOLDER}/";
                  done

                  echo "Backup completed."
              envFrom:
                - secretRef:
                    name: discord-secrets
              volumeMounts:
                - name: nas-data
                  mountPath: /data
          volumes:
            - name: nas-data
              persistentVolumeClaim:
                claimName: public-data-nas