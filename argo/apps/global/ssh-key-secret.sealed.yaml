kind: SealedSecret
metadata:
  name: ssh-keys
  namespace: default
spec:
  encryptedData:
    offsite: 
  template:
    metadata:
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      name: ssh-keys
      namespace: default
    type: Opaque
