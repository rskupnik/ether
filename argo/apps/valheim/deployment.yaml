apiVersion: apps/v1
kind: Deployment
metadata:
  name: valheim
spec:
  replicas: 1

  # Never try to briefly run two Valheim instances against
  # the same world data during an update.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: valheim

  template:
    metadata:
      labels:
        app: valheim

    spec:
      # Gracefully let Valheim save the world before Kubernetes
      # kills the process.
      terminationGracePeriodSeconds: 120

      # Force this workload onto the GMKtec.
      nodeSelector:
        kubernetes.io/hostname: ethernode-gmk

      containers:
        - name: valheim
          image: ghcr.io/lloesche/valheim-server:latest
          imagePullPolicy: IfNotPresent

          env:
            - name: SERVER_NAME
              value: "Myzopotamia"

            - name: WORLD_NAME
              value: "Myzopotamia"

            - name: SERVER_PASS
              valueFrom:
                secretKeyRef:
                  name: valheim-secret
                  key: server-password

            - name: SERVER_PUBLIC
              value: "true"

            # Uses PlayFab crossplay relay.
            # No router port forwarding required.
            # - name: SERVER_ARGS
            #   value: "-crossplay"

            - name: TZ
              value: "Europe/Warsaw"

            # Automatic updates.
            - name: UPDATE_CRON
              value: "*/15 * * * *"

            - name: UPDATE_IF_IDLE
              value: "true"

            # Built-in backups.
            - name: BACKUPS
              value: "true"

            - name: BACKUPS_CRON
              value: "0 * * * *"

            - name: BACKUPS_MAX_AGE
              value: "7"

          ports:
            - name: valheim
              containerPort: 2456
              protocol: UDP

            - name: valheim-query
              containerPort: 2457
              protocol: UDP

          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"

            limits:
              memory: "6Gi"

          volumeMounts:
            - name: config
              mountPath: /config

            - name: server-data
              mountPath: /opt/valheim
        - name: playit
          image: ghcr.io/playit-cloud/playit-agent:1.0.10
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: valheim-secret
                  key: playit-secret
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: gluetun
          image: qmcgaw/gluetun:v3

          securityContext:
            capabilities:
              add:
                - NET_ADMIN
              drop:
                - ALL

          env:
            - name: VPN_SERVICE_PROVIDER
              value: airvpn

            - name: VPN_TYPE
              value: wireguard

            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: valheim-secret
                  key: wireguard-private-key

            - name: WIREGUARD_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: valheim-secret
                  key: wireguard-preshared-key

            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: valheim-secret
                  key: wireguard-address

            # Pick a nearby AirVPN location.
            - name: SERVER_COUNTRIES
              value: Germany

            # Incoming connections from Kubernetes to qBittorrent's
            # Web UI/API would otherwise be blocked by Gluetun.
            - name: FIREWALL_INPUT_PORTS
              value: "2456,2457"

            # Your fixed AirVPN forwarded port.
            - name: FIREWALL_VPN_INPUT_PORTS
              value: "2456,2457"

            # Permit access to your LAN and Kubernetes networks.
            # Adjust these if your K3s CIDRs differ.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "192.168.1.0/24,10.42.0.0/16,10.43.0.0/16"

            - name: TZ
              value: Europe/Warsaw

            # Refresh Gluetun's provider server list periodically.
            # The project recommends no more often than every 15 days.
            - name: UPDATER_PERIOD
              value: "720h"
          
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun

            - name: gluetun-data
              mountPath: /gluetun
          
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi

      volumes:
        - name: config
          hostPath:
            path: /srv/valheim/config
            type: Directory

        - name: server-data
          hostPath:
            path: /srv/valheim/data
            type: Directory
        
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice

        - name: gluetun-data
          emptyDir: {}
