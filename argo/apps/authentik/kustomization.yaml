helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    releaseName: authentik
    namespace: authentik
    version: 2025.8.3
    valuesFile: values.yaml

components:
  - ../../components/ntfy-token
  - ../../components/tls-ingress

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tls-config
    literals:
      - host=authentik.myzopotamia.dev
      - service=authentik-server
      - port=http
      - pathType=Prefix

resources:
  - secrets/authentik-config-sealed.yaml
  - secrets/authentik-postgresql-custom-sealed.yaml

  # --- INTEGRATIONS

  # ARGOCD
  - integrations/argocd/secrets.sealed.yaml
