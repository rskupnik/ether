apiVersion: v1
kind: Service
metadata:
  name: qnap-webdav
  namespace: nas-webdav
spec:
  # No selector: the backend is an external device.
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: qnap-webdav-external
  namespace: nas-webdav
  labels:
    kubernetes.io/service-name: qnap-webdav
    endpointslice.kubernetes.io/managed-by: manual
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 5000
endpoints:
  - addresses:
      - "192.168.1.69"
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qnap-webdav
  namespace: nas-webdav
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - webdav.myzopotamia.dev
      secretName: nas-webdav-tls
  rules:
    - host: webdav.myzopotamia.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qnap-webdav
                port:
                  number: 80