apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: applications
  source:
    repoURL: https://github.com/rskupnik/ether.git
    targetRevision: HEAD
    path: argo/apps/immich
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: immich-server
      namespace: immich
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
