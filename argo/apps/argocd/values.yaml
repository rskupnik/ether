configs:
  params:
    server.insecure: true
  secret:
    argocdServerAdminPassword: $2y$10$4x03OZcmTpuEcI.sk53U8.UYyTVaCJXMUgNTg81eKG.YgUwgV1tRG
  cm:
    accounts.readonly: apiKey
    kustomize.buildOptions: --enable-helm
    url: https://argocd.myzopotamia.dev
  # Uncomment if not using authentik
  # rbac:
  #   policy.csv: |
  #     g, readonly, role:readonly
    # This is the default list of exclusions minus EndpointSlice
    resource.exclusions: |
      - apiGroups:
          - ""
        kinds:
          - Endpoints
      - apiGroups:
          - coordination.k8s.io
        kinds:
          - Lease
      - apiGroups:
          - authentication.k8s.io
          - authorization.k8s.io
        kinds:
          - SelfSubjectReview
          - TokenReview
          - LocalSubjectAccessReview
          - SelfSubjectAccessReview
          - SelfSubjectRulesReview
          - SubjectAccessReview
      - apiGroups:
          - certificates.k8s.io
        kinds:
          - CertificateSigningRequest
      - apiGroups:
          - cert-manager.io
        kinds:
          - CertificateRequest
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
          - CiliumEndpoint
          - CiliumEndpointSlice
      - apiGroups:
          - kyverno.io
          - reports.kyverno.io
          - wgpolicyk8s.io
        kinds:
          - PolicyReport
          - ClusterPolicyReport
          - EphemeralReport
          - ClusterEphemeralReport
          - AdmissionReport
          - ClusterAdmissionReport
          - BackgroundScanReport
          - ClusterBackgroundScanReport
          - UpdateRequest
