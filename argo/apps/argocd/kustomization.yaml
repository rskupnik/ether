helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    releaseName: argocd
    namespace: argocd
    version: 10.1.3
    valuesFile: values.yaml
    additionalValuesFiles:
      - authentik-values.yaml   # Comment to disable Authentik

components:
  - ../../components/tls-ingress

configMapGenerator:
  - name: tls-config
    literals:
      - host=argocd.nora
      - service=argocd-server
      - port=http
      - pathType=Prefix

resources:
  - apps