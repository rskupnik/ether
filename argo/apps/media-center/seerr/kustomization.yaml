helmCharts:
  - name: seerr-chart
    repo: oci://ghcr.io/seerr-team/seerr
    version: 3.6.0
    releaseName: seerr
    namespace: media
    valuesFile: values.yaml

resources:
  - config-pvc.yaml

generatorOptions:
  disableNameSuffixHash: true

components:
  - ../../../components/tls-ingress

configMapGenerator:
  - name: tls-config-seerr
    literals:
      - host=seerr.nora
      - service=seerr
      - port=http
      - pathType=Prefix