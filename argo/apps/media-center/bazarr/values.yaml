fullnameOverride: bazarr

env:
  - name: PUID
    value: "1000"
  - name: PGID
    value: "1000"
  - name: TZ
    value: Europe/Warsaw

persistence:
  enabled: true
  size: 2Gi
  storageClass: longhorn

volumes:
  - name: config
    persistentVolumeClaim:
      claimName: bazarr-config-iscsi-pvc
  - name: media
    persistentVolumeClaim:
      claimName: media-center-data

nodeSelector:
  kubernetes.io/hostname: ethernode1

volumeMounts:
  - name: config
    mountPath: /config
  - name: media
    mountPath: /movies
    subPath: media/movies
  - name: media
    mountPath: /tv
    subPath: media/tv

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
