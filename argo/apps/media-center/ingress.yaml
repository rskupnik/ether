apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-center
  namespace: media
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - jellyfin.media.myzopotamia.dev
        - sonarr.media.myzopotamia.dev
        - radarr.media.myzopotamia.dev
        - prowlarr.media.myzopotamia.dev
        - seerr.media.myzopotamia.dev
        - torrent.media.myzopotamia.dev
        - bazarr.media.myzopotamia.dev
      secretName: media-center-tls

  rules:
    - host: jellyfin.media.myzopotamia.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096

    - host: sonarr.media.myzopotamia.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  number: 8989

    - host: radarr.media.myzopotamia.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878

    - host: prowlarr.media.myzopotamia.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 9696

    - host: seerr.media.myzopotamia.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seerr
                port:
                  number: 80

    - host: torrent.media.myzopotamia.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080

    - host: bazarr.media.myzopotamia.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bazarr
                port:
                  number: 6767
