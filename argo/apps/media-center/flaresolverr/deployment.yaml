apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr

  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaresolverr

    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
          imagePullPolicy: IfNotPresent

          env:
            - name: TZ
              value: Europe/Warsaw

            - name: LOG_LEVEL
              value: info

            # Avoid logging complete returned HTML pages.
            - name: LOG_HTML
              value: "false"

            - name: CAPTCHA_SOLVER
              value: none

          ports:
            - name: http
              containerPort: 8191
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            # Chromium uses shared memory. A memory-backed emptyDir avoids
            # the small default /dev/shm available inside containers.
            - name: shared-memory
              mountPath: /dev/shm

      volumes:
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi