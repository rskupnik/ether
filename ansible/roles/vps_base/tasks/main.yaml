---
- name: Set timezone
  community.general.timezone:
    name: "{{ vps_timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ vps_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended security upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Configure automatic upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Disable SSH password authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-ansible-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
  notify: Restart SSH

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ vps_ssh_port }}"
    proto: tcp

- name: Allow Pangolin HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow HTTP for Let's Encrypt
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow Pangolin site tunnels
  community.general.ufw:
    rule: allow
    port: "51820"
    proto: udp

- name: Allow Pangolin VPN clients
  community.general.ufw:
    rule: allow
    port: "21820"
    proto: udp

- name: Set incoming firewall policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Enable UFW
  community.general.ufw:
    state: enabled