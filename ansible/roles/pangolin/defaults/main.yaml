---
pangolin_install_dir: /opt/pangolin

pangolin_base_domain: example.com
pangolin_dashboard_domain: pangolin.example.com

pangolin_site_port: 51820
pangolin_client_port: 21820

pangolin_image: fosrl/pangolin:latest
pangolin_gerbil_image: fosrl/gerbil:latest
pangolin_traefik_image: traefik:v3.7

pangolin_badger_version: v1.4.1
# CrowdSec (same engine protects Traefik and the host)
pangolin_crowdsec_image: crowdsecurity/crowdsec:latest-debian
pangolin_crowdsec_plugin_version: v1.4.5
pangolin_crowdsec_lapi_port: 8080
pangolin_crowdsec_collections: "crowdsecurity/traefik crowdsecurity/linux crowdsecurity/http-cve"
